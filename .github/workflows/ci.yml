name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install jsonschema

      - name: Validate plugin and marketplace manifests
        run: |
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .claude-plugin/marketplace.json

      - name: Validate skills
        run: claude plugin validate --strict skills

      - name: Validate example config against schema
        run: |
          python -c "import json, jsonschema; jsonschema.validate(json.load(open('config/agent-playbook.example.json')), json.load(open('config/agent-playbook.schema.json')))"

      - name: Check version bump
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/check-version.py "origin/${{ github.base_ref }}"
          else
            python scripts/check-version.py
          fi
